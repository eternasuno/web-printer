name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Verify and build
        run: |
          pnpm run verify
          pnpm run build
          grep -q '^// @version      '"$(node -p "require('./package.json').version")" dist/web-printer.user.js
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/web-printer.user.js
          generate_release_notes: true
